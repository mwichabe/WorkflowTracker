services:
  - type: web
    name: workflow-tracker-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py collectstatic --noinput && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: CORS_ALLOWED_ORIGINS
        value: https://rococo-cupcake-0483e2.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: workflow-tracker-db
          property: connectionString

databases:
  - name: workflow-tracker-db
    databaseName: workflowtracker
    user: workflowtracker
    plan: free
